<h1>Select números dobles</h1>
<form #formDobles = "ngForm">
    <button (click)="generarNumero()">
        Generar número
    </button>
    Elige un número de la lista: 
    <select name="selectnumero" #selectnumero>
        @for(num of arrayNumeros; track num){
            <option>{{num}}</option>
        }
    </select>
    <button (click)="mostrarDoble()">Ver doble</button>
</form>
@if(doble != 0){
    <h1 style="color: green;">
        El doble es {{doble}}
    </h1>
}
